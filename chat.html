<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ask IAS</title>
<meta name="description" content="Ask any question about moving to the United States and get a straight answer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow conversation column, brand header on top, composer pinned to the bottom of the card. */
:root{
  --navy:#1a3a6b; --navy-deep:#122a4f; --blue:#2255a4; --gold:#c9a84c;
  --bg:#eef2f8; --surface:#ffffff; --surface-2:#f5f7fb; --line:rgba(26,58,107,.12);
  --ink:#1c2533; --ink-soft:#56627a; --ink-faint:#8a94a8;
  --bubble-me:#1a3a6b; --bubble-me-ink:#ffffff;
  --pay-bg:#fbf6ea; --pay-line:rgba(201,168,76,.55); --pay-ink:#6b5216;
  --focus:#3b82f6; --err:#b42318;
  --display:'Playfair Display',Georgia,'Times New Roman',serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1524; --surface:#142035; --surface-2:#1a2942; --line:rgba(160,185,230,.16);
  --ink:#e8edf6; --ink-soft:#a9b5cb; --ink-faint:#7b88a1;
  --bubble-me:#2e5aa8; --bubble-me-ink:#ffffff; --navy:#9dbbf0; --blue:#7fa6ea;
  --pay-bg:#2a2414; --pay-line:rgba(201,168,76,.45); --pay-ink:#e6cf8f; --err:#f4a19a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1524; --surface:#142035; --surface-2:#1a2942; --line:rgba(160,185,230,.16);
  --ink:#e8edf6; --ink-soft:#a9b5cb; --ink-faint:#7b88a1;
  --bubble-me:#2e5aa8; --bubble-me-ink:#ffffff; --navy:#9dbbf0; --blue:#7fa6ea;
  --pay-bg:#2a2414; --pay-line:rgba(201,168,76,.45); --pay-ink:#e6cf8f; --err:#f4a19a; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
.page{max-width:680px;margin:0 auto;padding:20px 16px 16px;height:100%;display:flex;flex-direction:column;gap:14px}

.top{display:flex;align-items:center;gap:12px}
.top img{width:44px;height:44px;border-radius:10px;flex-shrink:0;box-shadow:0 2px 10px rgba(18,42,79,.25)}
.top .brand{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:500}
.top h1{margin:2px 0 0;font:600 clamp(20px,4.6vw,26px)/1.2 var(--display);color:var(--navy);text-wrap:balance}

.chat{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 30px rgba(18,42,79,.08);overflow:hidden}
.notice{font-size:12.5px;color:var(--pay-ink);background:var(--pay-bg);border-bottom:1px solid var(--pay-line);padding:7px 16px}
.log{flex:1;min-height:0;overflow-y:auto;padding:20px 18px 8px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){.log{scroll-behavior:auto}}

.msg{display:flex;gap:10px;max-width:100%;min-width:0}
.msg .av{width:28px;height:28px;border-radius:8px;flex-shrink:0;margin-top:2px}
.msg .b{min-width:0;padding:10px 14px;border-radius:var(--r);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai .b{background:var(--surface-2);border:1px solid var(--line);border-top-left-radius:4px;max-width:88%}
.msg.me{justify-content:flex-end}
.msg.me .b{background:var(--bubble-me);color:var(--bubble-me-ink);border-top-right-radius:4px;max-width:82%}
.msg .b.err{color:var(--ink-soft);font-style:italic}

.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}}

.go{margin-left:38px;max-width:calc(88% - 0px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.go .t{min-width:0;flex:1 1 220px}
.go .t b{display:block;font-weight:600;color:var(--navy);font-size:14.5px}
.go .t span{display:block;font-size:13px;color:var(--ink-soft)}
.go a{flex-shrink:0;text-decoration:none;font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px;background:var(--navy-deep);color:#fff}
:root[data-theme="dark"] .go a{background:#2e5aa8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .go a{background:#2e5aa8}}
.go.pay{background:var(--pay-bg);border-color:var(--pay-line)}
.go.pay .t b{color:var(--pay-ink)}
.go.pay a{background:var(--gold);color:#1f1a0b}
.go a:focus-visible,.chip:focus-visible,.send:focus-visible,
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-left:38px}
.chip{font:inherit;font-size:13.5px;color:var(--navy);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;text-align:left}
.chip:hover{background:var(--surface-2)}
.chip.other{color:var(--ink-soft);border-style:dashed}


.compose{display:flex;gap:8px;align-items:flex-end;padding:12px;border-top:1px solid var(--line);background:var(--surface)}
.compose textarea{flex:1;min-width:0;resize:none;font:inherit;line-height:1.45;max-height:140px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);color:var(--ink)}
.compose textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.send{flex-shrink:0;width:44px;height:44px;border:0;border-radius:12px;background:var(--navy-deep);color:#fff;cursor:pointer;display:grid;place-items:center}
:root[data-theme="dark"] .send{background:#2e5aa8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .send{background:#2e5aa8}}
.send:disabled{opacity:.45;cursor:default}

.gate{margin-left:38px;display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.fld{display:grid;gap:4px;font-size:13px;color:var(--ink-soft)}
.fld input{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);min-width:0}
.fld input:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.phone{display:flex;gap:8px;min-width:0}
.phone select{flex:0 0 auto;max-width:42%;font:inherit;font-size:15px;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink)}
.phone select:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.phone input{flex:1 1 auto}
.gate button{justify-self:start;font:inherit;font-weight:600;padding:10px 22px;border:0;border-radius:999px;background:var(--navy-deep);color:#fff;cursor:pointer}
.gate button:disabled{opacity:.6}
.gate button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.gate-err{margin:0;font-size:13px;color:var(--err)}
.gate-note,.gate-done{margin:0;font-size:12.5px;color:var(--ink-faint)}
.gate-done{margin-left:38px}
.compose textarea:disabled{opacity:.6}
.foot{font-size:11.5px;color:var(--ink-faint);text-align:center;line-height:1.5;padding:0 8px}
</style>

</head>

<script>
(function () {
"use strict";

// ── Where things go ──────────────────────────────────────────────
var SITE   = "https://supportimmigrationadviceserviceorg.github.io/assessment/";
var CHAT_API = "https://ias-chat.calm-rain-5660.workers.dev";
var PAY    = "https://immigrationadviceservice.org/new-va-payment-29/";
var MAX_USER_TURNS = 30;

var qs = new URLSearchParams(location.search);
var email = clean(qs.get("email"));
var campaign = (qs.get("utm_campaign") || "").trim();
if (campaign.indexOf("XXXX") !== -1) campaign = "";

function clean(v) {
  v = (v || "").trim();
  return (v.indexOf("@") > 0 && v.indexOf("#") === -1) ? v : "";
}
function link(base, params) {
  var p = new URLSearchParams();
  Object.keys(params).forEach(function (k) { if (params[k]) p.set(k, params[k]); });
  var s = p.toString();
  return base + (s ? (base.indexOf("?") === -1 ? "?" : "&") + s : "");
}

// The pages Claude may send someone to. Keys are what the model writes in [[GO:key]].
function destinations() {
  var utm = { utm_source: "ias_chat", utm_campaign: campaign };
  return {
    pay: { pay: true, title: "Attorney review of your case — $29",
      line: "A licensed immigration attorney reviews your profile and lists every route open to you.",
      cta: "Start my review", url: link(PAY, utm) },
    assessment: { title: "Full eligibility check",
      line: "Ten short questions, then a report of the routes that fit you.",
      cta: "Check my eligibility", url: link(SITE + "index_29_new.html", { email: email, utm_campaign: campaign, utm_source: "ias_chat" }) },
    salary: { title: "What your work is worth in the U.S.",
      line: "See the U.S. salary range for your field. It matters for work visas.",
      cta: "See my salary range", url: link(SITE + "salary.html", { email: email, utm_campaign: campaign }) },
    e2_call: { title: "Free investor visa consultation",
      line: "Talk through your budget and business plans with our team.",
      cta: "Book a call", url: link(SITE + "e2_booking_en.html", utm) },
    dream_map: { title: "Your American life map",
      line: "Compare U.S. cities on cost of living, jobs and lifestyle.",
      cta: "Open the map", url: link(SITE + "dream_map_1.html", { utm_source: "ias_chat" }) },
    dv: { title: "Green Card lottery updates",
      line: "Get told when the next registration opens and whether you qualify.",
      cta: "Join the update list", url: link(SITE + "dv-notify.html", { email: email, utm_campaign: campaign }) }
  };
}

// ── How the assistant behaves ────────────────────────────────────
var RULES = "";   // filled only in the test build; the live Worker holds its own copy

// ── State ────────────────────────────────────────────────────────
var log = document.getElementById("log");
var box = document.getElementById("box");
var sendBtn = document.getElementById("send");
var turns = [];            // {role, content} — content keeps the raw [[GO]] markers
var busy = false;
var sample = null;         // set when this page runs as a test artifact
var LOGO = document.querySelector(".top img").src;

// ── Rendering ────────────────────────────────────────────────────
function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function scroll() { log.scrollTop = log.scrollHeight; }

function addMsg(who, text) {
  var m = el("div", "msg " + who);
  if (who === "ai") { var a = el("img", "av"); a.src = LOGO; a.alt = ""; m.appendChild(a); }
  var b = el("div", "b");
  if (text != null) b.textContent = text;
  m.appendChild(b);
  log.appendChild(m);
  scroll();
  return b;
}
function typing(b) {
  b.textContent = "";
  var d = el("span", "dots"); d.setAttribute("aria-label", "Typing");
  d.appendChild(el("i")); d.appendChild(el("i")); d.appendChild(el("i"));
  b.appendChild(d);
}
function visible(raw) {
  var i = raw.indexOf("[[");
  return (i === -1 ? raw : raw.slice(0, i)).replace(/\*\*/g, "").trim();
}
function addGo(key) {
  var d = destinations()[key];
  if (!d) return;
  var c = el("div", "go" + (d.pay ? " pay" : ""));
  var t = el("div", "t");
  t.appendChild(el("b", null, d.title));
  t.appendChild(el("span", null, d.line));
  var a = el("a", null, d.cta + " →");
  a.href = d.url; a.target = "_blank"; a.rel = "noopener";
  a.addEventListener("click", function () { note("clicked " + key); });
  c.appendChild(t); c.appendChild(a);
  log.appendChild(c);
  scroll();
}

// Quick answers the assistant offers after a question; the composer stays open for anything else.
function addOptions(list) {
  list = list.map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 4);
  if (!list.length) return;
  var w = el("div", "chips"); w.id = "opts";
  list.forEach(function (s) {
    var c = el("button", "chip", s); c.type = "button";
    c.addEventListener("click", function () { submit(s); });
    w.appendChild(c);
  });
  var other = el("button", "chip other", "Something else…"); other.type = "button";
  other.addEventListener("click", function () { box.focus(); });
  w.appendChild(other);
  log.appendChild(w);
  scroll();
}

var STARTERS = [
  "What visa can I get to move to the USA?",
  "Am I eligible for a Green Card?",
  "Can I move to the USA without a job or family there?",
  "How long does the immigration process take?"
];
function addChips() {
  var w = el("div", "chips"); w.id = "chips";
  STARTERS.forEach(function (s) {
    var c = el("button", "chip", s); c.type = "button";
    c.addEventListener("click", function () { submit(s); });
    w.appendChild(c);
  });
  log.appendChild(w);
}

// ── Talking to the assistant ─────────────────────────────────────
var TEST = !!RULES;                 // the test build carries the instructions; the live build does not
var GATE_AFTER = 3;                 // client messages answered before asking a visitor without an email who they are
var gated = false;                  // true while the contact form is waiting
var commentId = 0;                  // the one Bitrix timeline comment this conversation lives in
var source = (qs.get("utm_source") || "").trim();

function api(payload, keep) {
  return fetch(CHAT_API, {
    method: "POST", keepalive: !!keep,
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(function (r) { return r.json(); });
}

function recent(t) {                // the latest 24 turns, starting on a client turn
  var r = t.slice(-24);
  while (r.length && r[0].role !== "user") r.shift();
  return r;
}

function ask(onText) {
  var conv = recent(turns);
  if (sample) {
    return sample([{ role: "user", content: RULES + "\n\nThe person's messages follow." }].concat(conv), {
      cache: false, modelTier: "quick",
      onText: function (u) { onText(u.text); }
    }).then(function (r) { return r.text; });
  }
  return api({ action: "chat", e: email, messages: conv }).then(function (j) {
    if (!j || !j.reply) throw { code: (j && j.error) || "upstream_error" };
    onText(j.reply);
    return j.reply;
  });
}

function count(role) { return turns.filter(function (t) { return t.role === role; }).length; }

function submit(text) {
  text = (text || "").trim();
  if (!text || busy || gated) return;
  ["chips", "opts"].forEach(function (id) { var c = document.getElementById(id); if (c) c.remove(); });
  if (count("user") >= MAX_USER_TURNS) {
    addMsg("ai", "We have covered a lot. The best way to go further is the attorney review, where your whole profile is looked at properly.");
    addGo("pay");
    return;
  }
  addMsg("me", text);
  turns.push({ role: "user", content: text });
  box.value = ""; size();
  lock(true);

  var b = addMsg("ai");
  typing(b);
  ask(function (raw) { b.textContent = visible(raw) || ""; if (!b.textContent) typing(b); scroll(); })
    .then(function (raw) {
      b.textContent = visible(raw);
      turns.push({ role: "assistant", content: raw });
      var m = raw.match(/\[\[GO:([a-z_]+)\]\]/);
      if (m) addGo(m[1]);
      var op = raw.match(/\[\[OPTIONS:([^\]]+)\]\]/);
      if (op) addOptions(op[1].split("|"));
      save(false);
      if (!email && count("assistant") >= GATE_AFTER) askContact();
    })
    .catch(function (e) {
      var code = e && e.code;
      if (code === "cancelled") return;
      if (e && e.text) { b.textContent = visible(e.text); return; }
      b.classList.add("err");
      b.textContent = code === "rate_limited"
        ? "Too many questions in a short time. Wait a minute and send again."
        : code === "not_granted"
        ? "This test page needs permission to use Claude. Reload and allow it to try again."
        : "That answer did not come through. Send your message again.";
      turns.pop();
    })
    .then(function () { if (!gated) { lock(false); box.focus(); } });
}

function lock(on) {
  busy = on; sendBtn.disabled = on || gated; box.disabled = gated;
  box.placeholder = gated ? "Add your details above to continue" : "Type your question…";
}

function askContact() {
  gated = true; lock(false);
  var ask = addMsg("ai", "Happy to keep going. So your answers stay saved and a consultant can follow up with the details that apply to you, where can we reach you?");
  var f = el("form", "gate"); f.id = "gate"; f.noValidate = true;
  function field(id, label, type, ac, ph) {
    var w = el("label", "fld"); w.htmlFor = id;
    w.appendChild(el("span", null, label));
    var i = el("input"); i.id = id; i.type = type; i.autocomplete = ac; i.placeholder = ph;
    w.appendChild(i); f.appendChild(w); return i;
  }
  var n = field("gate-name", "Full name", "text", "name", "Maria Lopez");
  var e = field("gate-email", "Email", "email", "email", "you@example.com");
  var pw = el("div", "fld"); pw.appendChild(el("span", null, "Phone number"));
  var row = el("div", "phone");
  var cc = el("select"); cc.id = "gate-cc"; cc.setAttribute("aria-label", "Country code");
  var us = 0;
  DIAL.forEach(function (c, i) {
    var o = el("option", null, c.iso + "  +" + c.code); o.value = "+" + c.code; o.title = c.name;
    cc.appendChild(o); if (c.iso === "US") us = i;
  });
  cc.selectedIndex = us;
  var p = el("input"); p.id = "gate-phone"; p.type = "tel"; p.inputMode = "tel"; p.autocomplete = "tel-national"; p.placeholder = "555 123 4567";
  p.setAttribute("aria-label", "Phone number");
  row.appendChild(cc); row.appendChild(p); pw.appendChild(row); f.appendChild(pw);
  var msg = el("p", "gate-err"); msg.hidden = true; f.appendChild(msg);
  var go = el("button", null, "Continue"); go.type = "submit"; f.appendChild(go);
  f.appendChild(el("p", "gate-note", "We use these only to follow up on your questions."));
  f.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var name = n.value.trim(), mail = clean(e.value), tel = p.value.replace(/\D/g, "");
    var bad = !name ? n : !mail ? e : tel.length < 7 ? p : null;
    if (bad) {
      msg.hidden = false;
      msg.textContent = bad === n ? "Please add your name." : bad === e ? "Please check the email address." : "Please add your phone number.";
      bad.focus(); return;
    }
    go.disabled = true; go.textContent = "Saving…";
    var done = function () {
      email = mail;
      // Once they have answered, the request and the form disappear and the chat simply carries on.
      ask.parentNode.remove(); f.remove();
      gated = false; lock(false); box.focus();
      save(true);
    };
    if (sample) { done(); return; }
    api({ action: "register", name: name, e: mail, phone: cc.value + " " + p.value.trim(), campaign: campaign, source: source || "ias_chat" })
      .then(function (j) { if (j && j.ok) done(); else throw 0; })
      .catch(function () {
        go.disabled = false; go.textContent = "Continue";
        msg.hidden = false; msg.textContent = "That did not save. Check your connection and press Continue again.";
      });
  });
  log.appendChild(f);
  scroll();
  setTimeout(function () { n.focus(); }, 50);
}

var saveTimer = null, clicks = [];
function transcript() {
  return turns.map(function (t) {
    return (t.role === "user" ? "Client: " : "IAS assistant: ") + t.content.replace(/\[\[GO:([a-z_]+)\]\]/g, "(offered: $1)").replace(/\[\[OPTIONS:[^\]]*\]\]/g, "").trim();
  }).join("\n\n") + (clicks.length ? "\n\nButtons clicked: " + clicks.join(", ") : "");
}
function save(now) {
  if (sample || TEST || !email || !turns.length) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    api({ action: "log", e: email, campaign: campaign, transcript: transcript(), cid: commentId }, true)
      .then(function (j) { if (j && j.cid) commentId = j.cid; })
      .catch(function () {});
  }, now ? 0 : 1500);
}
function note(what) { clicks.push(what); save(true); }
addEventListener("pagehide", function () { save(true); });
