<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>A message from the Immigration Advice Service</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #dde3ec;
    font-family: Georgia, 'Times New Roman', serif;
    color: #2a2a28;
  }
  .wrap {
    max-width: 680px;
    margin: 40px auto;
    background: #f4f1ea;
    border: 1px solid #c7bfa8;
    border-radius: 2px;
  }
  .head {
    padding: 22px 40px 18px;
    text-align: center;
    border-bottom: 3px double #1a3a6b;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 4px;
    color: #7a6f52;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .head h1 {
    font-size: 19px;
    font-weight: bold;
    color: #1a3a6b;
    line-height: 1.4;
    margin: 0;
  }
  .body { padding: 30px 40px 36px; }
  video {
    width: 100%;
    display: block;
    border: 1px solid #c7bfa8;
    border-radius: 2px;
    background: #000;
  }
  .cta-zone { text-align: center; margin-top: 30px; }
  .cta {
    display: inline-block;
    background: #1a3a6b;
    color: #f4f1ea;
    font-size: 17px;
    letter-spacing: 0.5px;
    padding: 17px 52px;
    border-radius: 2px;
    text-decoration: none;
    border: 1px solid #1a3a6b;
  }
  .note { font-size: 13px; color: #8a8270; margin-top: 12px; }
  .alt {
    font-size: 13px;
    color: #3a3a36;
    line-height: 1.8;
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid #d8d2c0;
    text-align: center;
  }
  .alt a { color: #7a6f52; }
  .foot {
    background: #eceae2;
    padding: 16px 40px;
    border-top: 1px solid #c7bfa8;
    text-align: center;
    font-size: 11px;
    color: #9a917c;
    letter-spacing: 0.5px;
  }
  .foot a { color: #9a917c; text-decoration: none; }
  @media (max-width: 620px) {
    .wrap { margin: 0; border-left: 0; border-right: 0; }
    .body { padding: 22px 18px 28px; }
    .head { padding: 20px 18px 16px; }
    .cta { padding: 16px 34px; font-size: 16px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="head">
    <div class="eyebrow">Immigration Advice Service</div>
    <h1>We Tried to Reach You</h1>
  </div>

  <div class="body">

    <video controls playsinline preload="metadata"
           poster="https://supportimmigrationadviceserviceorg.github.io/assessment/ias-video-thumbnail.jpg">
      <source src="https://stream.mux.com/hhj25m4cQCqVLhz2BOq2JcZABCIINXL7IbbAk01purGo/high.mp4" type="video/mp4">
      Your browser does not support video playback.
      <a href="https://tavus.video/49c05b3142">Watch the message here</a>.
    </video>

    <div class="cta-zone">
      <a class="cta" href="https://calendly.com/support-ias/immigration-process-guidance">Schedule My Call</a>
      <div class="note">Takes less than a minute to book</div>
    </div>

    <div class="alt">
      Prefer to write instead? Email us at
      <a href="mailto:support@immigrationadviceservice.org">support@immigrationadviceservice.org</a>
      and we will be happy to assist you.
    </div>

  </div>

  <div class="foot">
    IMMIGRATION ADVICE SERVICE &nbsp;·&nbsp;
    <a href="https://immigrationadviceservice.org">immigrationadviceservice.org</a>
  </div>

</div>

</body>
</html>
